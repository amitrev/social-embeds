name: Pages

# The playground as a static demo at https://amitrev.github.io/social-embeds/ (docs/releasing.md).
# A release builds its own tag, so the demo matches the version on npm.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'A release tag (vX.Y.Z), or main; empty for the latest release'
        required: false
        default: ''

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A manual run builds the latest release unless told otherwise, never main by accident.
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          ref="${RELEASE_TAG:-${INPUT_REF:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}}"
          if [[ "$ref" == main ]]; then
            echo "ref=refs/heads/main" >> "$GITHUB_OUTPUT"
          elif [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ref=refs/tags/$ref" >> "$GITHUB_OUTPUT"
          else
            echo "not a release tag or main: $ref" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir playground build
        env:
          PAGES_BASE_PATH: /social-embeds
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playground/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
