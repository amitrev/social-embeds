version: 2

updates:
  # Dependabot moves the SHA and the version comment on the same line together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope

  # From the root, where pnpm-lock.yaml is: an entry for /playground would leave it stale.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm refuses packages younger than its minimum release age (docs/decisions.md D7).
    cooldown:
      default-days: 2
    # Peer dependencies are not allowed: the react and react-dom ranges are never narrowed.
    allow:
      - dependency-type: development
      - dependency-name: next
    versioning-strategy: increase
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only (docs/decisions.md D3).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Kept at the oldest Node.js line the package supports (engines >=22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
