# Weekly updates for the GitHub Actions, which the workflows pin to commit SHAs, and for the
# development dependencies. The package itself has no runtime dependencies, and its react
# and react-dom peer ranges are left alone.
#
# Every update waits two days after its release: pnpm refuses packages younger than its
# 24-hour minimum release age, and a short wait keeps freshly compromised releases out.

version: 2

updates:
  # Dependabot moves the SHA and the version comment on the same line together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope

  # The whole pnpm workspace, the package and the playground, from the root: Dependabot
  # reads pnpm-lock.yaml there. An entry for /playground would leave that lockfile stale.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    # Development dependencies, plus the playground's Next.js. Peer dependencies are not
    # allowed, so the package's react and react-dom ranges are never narrowed.
    allow:
      - dependency-type: development
      - dependency-name: next
    versioning-strategy: increase
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only (docs/decisions.md D3).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Kept at the oldest Node.js line the package supports (engines >=22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
